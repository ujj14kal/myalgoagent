AWSTemplateFormatVersion: "2010-09-09"
Description: MyAlgoAgent CloudFront in front of the load balancer. The domain records are switched separately at cutover, so creating this changes nothing for visitors.
Parameters:
  CertificateArn: { Type: String, Description: "us-east-1 certificate from certificate.yaml" }
  OriginHostName: { Type: String, Default: origin.myalgoagent.com }
  OriginSecret: { Type: String, NoEcho: true, Description: "Value sent in X-Origin-Verify; the load balancer rejects requests without it" }
Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: MyAlgoAgent website
        Aliases: [myalgoagent.com, www.myalgoagent.com]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        ViewerCertificate: { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
        Origins:
          - Id: alb
            DomainName: !Ref OriginHostName
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], HTTPSPort: 443, OriginReadTimeout: 60, OriginKeepaliveTimeout: 30 }
            OriginCustomHeaders: [{ HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginSecret }]
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # CachingDisabled: pages are personal and dynamic
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc   # AllViewerAndCloudFrontHeaders: includes CloudFront-Viewer-Address for rate limits
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized: fingerprinted build files
        CustomErrorResponses: []
Outputs:
  DistributionId: { Value: !Ref Distribution }
  DomainName: { Value: !GetAtt Distribution.DomainName }
