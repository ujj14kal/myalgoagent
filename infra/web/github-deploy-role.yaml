AWSTemplateFormatVersion: "2010-09-09"
Description: Lets GitHub Actions (this repository, main branch only) push the website image and roll out the Fargate service. No stored keys.
Parameters:
  OidcProviderArn: { Type: String, Default: "arn:aws:iam::327076610444:oidc-provider/token.actions.githubusercontent.com" }
  Repository: { Type: String, Default: ujj14kal/myalgoagent }
  ImmutableRepository: { Type: String, Default: "ujj14kal@85072622/myalgoagent@1353622998" }
Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: myalgoagent-web-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref OidcProviderArn }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: { "token.actions.githubusercontent.com:aud": sts.amazonaws.com }
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${Repository}:ref:refs/heads/main"
                  - !Sub "repo:${ImmutableRepository}:ref:refs/heads/main"
      Policies:
        - PolicyName: web-release
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: "ecr:GetAuthorizationToken", Resource: "*" }
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:DescribeImages]
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/myalgoagent-web"
              - { Effect: Allow, Action: [ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition], Resource: "*" }
              - { Effect: Allow, Action: [ecs:UpdateService, ecs:DescribeServices], Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/myalgoagent/myalgoagent-web" }
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/myalgoagent-web-*"
                Condition: { StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com } }
Outputs:
  RoleArn: { Value: !GetAtt DeployRole.Arn }
