version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Quality gate: a failing typecheck, lint or unit test fails the build,
        # so it never deploys (mirrors .github/workflows/ci.yml).
        - npx next typegen
        - npx tsc --noEmit
        - npm run lint
        - npx vitest run
        # Amplify Hosting only exposes console-configured env vars to the
        # build phase, not to the Next.js SSR compute runtime — Next.js
        # server code only reads vars that are present in .env.production.
        # Only NON-secret settings are written here. Secrets (database URL,
        # auth secret, broker encryption key, feed login…) live encrypted in
        # Parameter Store under /myalgoagent/app/ and are loaded at server
        # start (src/lib/runtime-secrets.ts), so they never enter the build output.
        - env | grep -E '^(AUTH_URL|AUTH_GOOGLE_ID|AUTH_TRUST_HOST|NEXT_PUBLIC_[A-Z0-9_]*|MARKET_DATA_LICENSED_USER_IDS|MARKET_DATA_LICENSED_FOR_TRADING|BROKER_EGRESS_URL)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
