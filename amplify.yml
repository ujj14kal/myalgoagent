version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify Hosting only exposes console-configured env vars to the
        # build phase, not to the Next.js SSR compute runtime — Next.js
        # server code only reads vars that are actually present in
        # .env.production at build time. See:
        # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        - env | grep -e AUTH_ -e DATABASE_URL -e NEXT_PUBLIC_ >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
